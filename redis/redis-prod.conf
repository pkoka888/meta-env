# Redis Production Configuration
# Production-grade settings with security and persistence
# Load with: redis-server redis.conf --include redis-prod.conf

# Include base configuration
include /home/user/meta-env/redis/redis.conf

# Production-Specific Settings

# Network Security
bind 127.0.0.1
protected-mode yes

# Security - REQUIRED: Set strong password
requirepass CHANGE_THIS_IN_PRODUCTION_USE_ENV_VAR
# Rename dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_b89e3c7a8f2d1e4c"
rename-command DEBUG ""

# Logging - Production level
loglevel notice
logfile "/var/log/redis/redis-prod.log"
syslog-enabled yes
syslog-ident redis-production
syslog-facility local0

# Persistence - Full RDB + AOF for data safety
# RDB Snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump-production.rdb
dir /var/lib/redis/

# AOF Persistence
appendonly yes
appendfilename "appendonly-production.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Memory Management - Critical for production
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Replication (if using master-replica setup)
# replicaof <masterip> <masterport>
# masterauth <master-password>
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# Client Limits
maxclients 10000
tcp-backlog 511

# Slow Log - Production monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitoring
latency-monitor-threshold 100

# Advanced Performance
activerehashing yes
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Client Output Buffers - Prevent memory issues
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Keyspace Notifications - Minimal for performance
notify-keyspace-events ""

# Supervised (systemd)
supervised systemd

# Production Database Allocation
# DB 0-3:   main-application
# DB 4-7:   cache-layer
# DB 8-11:  session-management
# DB 12-15: background-jobs

# TLS/SSL Configuration (if using encryption)
# port 0
# tls-port 6379
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt

# Monitoring Integration
# Compatible with Prometheus, Grafana, and other monitoring tools
# Use redis_exporter for Prometheus metrics

# Backup Strategy Notes:
# - RDB: Point-in-time snapshots, good for backups
# - AOF: Append-only log, better durability
# - Both enabled for maximum data safety
# - Regular backups stored in /var/lib/redis/backups/

# Performance Tuning:
# - vm.overcommit_memory = 1
# - Disable Transparent Huge Pages (THP)
# - Set appropriate file descriptors limit
# - Monitor with redis-cli --latency-history
