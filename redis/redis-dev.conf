# Redis Development Configuration
# Overrides for development environment
# Load with: redis-server redis.conf --include redis-dev.conf

# Include base configuration
include /home/user/meta-env/redis/redis.conf

# Development-Specific Settings

# Logging - More verbose for debugging
loglevel debug
logfile "/var/log/redis/redis-dev.log"

# Network - Allow connections from docker containers
bind 127.0.0.1 172.17.0.1

# Security - Disabled for local development
protected-mode no
# requirepass disabled

# Performance - Optimized for development
# Disable persistence for faster development
save ""
appendonly no

# Memory - Limit memory usage on dev machine
maxmemory 256mb
maxmemory-policy allkeys-lru

# Slower background saves to reduce CPU usage
rdb-save-incremental-fsync yes

# Development Database Isolation
# DB 0: Main development
# DB 1: Testing/Experimental
# DB 2: Cache testing
# DB 3-15: Available for feature branches

# Monitoring - Enable keyspace notifications for debugging
notify-keyspace-events "AKE"

# Slow Log - Catch slower queries in development
slowlog-log-slower-than 5000
slowlog-max-len 256

# Latency Monitoring
latency-monitor-threshold 100

# Client Limits - Lower for dev environment
maxclients 1000

# Development Tools Integration
# Enable commands that might be restricted in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""

# Hot Reload - Faster restarts
stop-writes-on-bgsave-error no

# Development Notes:
# - Use redis-cli MONITOR for real-time command monitoring
# - Use redis-cli --latency for latency testing
# - Use redis-cli --stat for statistics
# - Connect via: redis-cli -n <db-number>
