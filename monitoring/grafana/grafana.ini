##################### Grafana Configuration for Meta-Env #####################
# Meta-Env Multi-Server Monitoring
# Documentation: /home/user/meta-env/SERVERS.md
# Server: 192.168.1.60:3000 (VPN/Local access only)
###############################################################################

[paths]
# Path to where grafana stores its data
data = /var/lib/grafana
# Temporary files directory
temp_data_lifetime = 24h
# Directory where grafana will store logs
logs = /var/log/grafana
# Directory where grafana will automatically scan and look for plugins
plugins = /var/lib/grafana/plugins
# Directory where grafana will store provisioning files
provisioning = /etc/grafana/provisioning

[server]
# Protocol (http, https, h2, socket)
protocol = http
# The ip address to bind to, empty will bind to all interfaces
http_addr = 0.0.0.0
# The http port to use
http_port = 3000
# The public facing domain name used to access grafana from a browser
domain = 192.168.1.60
# Redirect to correct domain if host header does not match domain
enforce_domain = false
# The full public facing url
root_url = http://192.168.1.60:3000/
# Serve Grafana from subpath specified in `root_url` setting
serve_from_sub_path = false
# Log web requests
router_logging = true
# Enable gzip
enable_gzip = true

[database]
# Database type (sqlite3, mysql, postgres)
type = sqlite3
# Database host (only applies to mysql and postgres)
host = 127.0.0.1:3306
# Database name
name = grafana
# Database user
user = root
# Database password
password =
# Use either URL or the previous fields to configure the database
url =
# Max idle database connections
max_idle_conn = 2
# Max open database connections
max_open_conn =
# Connection max lifetime
conn_max_lifetime = 14400
# Logging of database queries
log_queries =
# Cache TTL for dashboards and data sources
cache_ttl = 5

[security]
# Default admin user
admin_user = admin
# Default admin password (change immediately after first login)
admin_password = admin
# Used for signing cookies
secret_key = SW2YcwTIb9zpOOhoPsMm
# Disable creation of admin user on first start of grafana
disable_initial_admin_creation = false
# Disable gravatar profile images
disable_gravatar = false
# Data source proxy whitelist (ip_or_domain:port separated by spaces)
data_source_proxy_whitelist =
# Disable brute force login protection
disable_brute_force_login_protection = false
# Cookie security settings
cookie_secure = false
cookie_samesite = lax
# Allow embedding Grafana in an iframe
allow_embedding = false
# Set to true if you host Grafana behind HTTPS
strict_transport_security = false

[users]
# Disable user signup / registration
allow_sign_up = false
# Allow non admin users to create organizations
allow_org_create = false
# Set to true to automatically assign new users to the default organization (id 1)
auto_assign_org = true
# Set this value to automatically add new users to the provided organization (if auto_assign_org is set to true)
auto_assign_org_id = 1
# Default role new users will be automatically assigned
auto_assign_org_role = Viewer
# Require email validation before sign up completes
verify_email_enabled = false
# Background text for the user field on the login page
login_hint = email or username
# Default UI theme ("dark" or "light")
default_theme = dark
# External user management
external_manage_link_url =
external_manage_link_name =
external_manage_info =
# Viewers can edit/inspect dashboard settings in the browser
viewers_can_edit = false
# Editors can administrate dashboard, folders and teams they create
editors_can_admin = false
# The duration in time a user invitation remains valid before expiring
user_invite_max_lifetime_duration = 24h

[auth]
# Login cookie name
login_cookie_name = grafana_session
# The maximum lifetime (duration) an authenticated user can be inactive before being required to login at next visit
login_maximum_inactive_lifetime_duration =
# The maximum lifetime (duration) an authenticated user can be logged in since login time before being required to login
login_maximum_lifetime_duration =
# How often should auth tokens be rotated for authenticated users when being active
token_rotation_interval_minutes = 10
# Set to true to disable (hide) the login form
disable_login_form = false
# Set to true to disable the sign out link in the side menu
disable_signout_menu = false
# URL to redirect the user to after sign out
signout_redirect_url =
# Set to true to attempt login with OAuth automatically
oauth_auto_login = false

[auth.anonymous]
# Enable anonymous access
enabled = false
# Specify organization name that should be used for anonymous users
org_name = Main Org.
# Specify role for anonymous users
org_role = Viewer

[auth.basic]
# Enable basic authentication
enabled = true

[smtp]
enabled = false
host = localhost:25
user =
# If the password contains # or ; you have to wrap it with triple quotes
password =
cert_file =
key_file =
skip_verify = false
from_address = admin@grafana.localhost
from_name = Grafana
ehlo_identity =

[emails]
welcome_email_on_sign_up = false
templates_pattern = emails/*.html

[log]
# Either "console", "file", "syslog"
mode = console file
# Either "debug", "info", "warn", "error", "critical"
level = info
# Optional settings to set different levels for specific loggers
filters =
# For "console" mode only
[log.console]
level =
format = console
# For "file" mode only
[log.file]
level =
format = text
log_rotate = true
max_lines = 1000000
max_size_shift = 28
daily_rotate = true
max_days = 7

[log.syslog]
level =
format = text
network =
address =
facility =
tag =

[metrics]
# Enable metrics
enabled = true
# Metrics path
interval_seconds = 10
# Disable total stats (stat_totals_*) metrics to be generated
disable_total_stats = false

[analytics]
# Enable Google Analytics tracking
reporting_enabled = false
# Google Analytics universal tracking code
google_analytics_ua_id =
# Set to true to enable tag manager
google_tag_manager_id =

[dashboards]
# Versions to keep per dashboard
versions_to_keep = 20
# Minimum dashboard refresh interval
min_refresh_interval = 5s
# Path to the default home dashboard
default_home_dashboard_path =

[unified_alerting]
# Enable or disable unified alerting
enabled = true
# Comma-separated list of organization IDs for which to disable unified alerting
disabled_orgs =
# Specify the frequency of polling for admin config changes
admin_config_poll_interval = 60s
# Specify the frequency of polling for alertmanager config changes
alertmanager_config_poll_interval = 60s
# Listen address/hostname and port to receive unified alerting messages from other Grafana instances
ha_listen_address = "0.0.0.0:9094"
# Explicit address/hostname and port to advertise to other Grafana instances
ha_advertise_address =
# Comma-separated list of initial instances (in a format of host:port) that will form the HA cluster
ha_peers =
# Time to wait for an instance to send a notification via the Alertmanager
ha_peer_timeout = 15s
# Maximum number of times to retry remote Alertmanager calls
max_attempts = 3
# Time between retries
min_interval = 10s

[alerting]
# Disable legacy alerting engine
enabled = false
# Makes it possible to turn off alert execution
execute_alerts = true
# Default setting for new alert rules
error_or_timeout = alerting
# Default setting for how Grafana handles nodata or null values in alerting
nodata_or_nullvalues = no_data
# Alert notifications can include images
concurrent_render_limit = 5
# Default setting for alert calculation timeout
evaluation_timeout_seconds = 30
# Default setting for alert notification timeout
notification_timeout_seconds = 30
# Default setting for max attempts to sending alert notifications
max_attempts = 3

[panels]
# Enable or disable deprecated panel plugins
disable_sanitize_html = false

[plugins]
# Enable plugins
enable_alpha = false
# Allow loading unsigned plugins
allow_loading_unsigned_plugins =

[live]
# Max number of connections to Grafana Live per Grafana server instance
max_connections = 100
# Allowed origins for Grafana Live
allowed_origins =

[feature_toggles]
# Enable new features that are still in development
enable =

[date_formats]
# Default system date format used in time range picker and other places where full time is displayed
full_date = YYYY-MM-DD HH:mm:ss
# Used by graph and other plugins to format time intervals
interval_second = HH:mm:ss
interval_minute = HH:mm
interval_hour = MM/DD HH:mm
interval_day = MM/DD
interval_month = YYYY-MM
interval_year = YYYY
# Experimental feature
use_browser_locale = false
# Default timezone for user preferences
default_timezone = browser

