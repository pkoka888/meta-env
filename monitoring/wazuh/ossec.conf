<!--
  Wazuh - Security Monitoring Configuration for Meta-Env Infrastructure

  This configuration is designed for multi-server monitoring:
  - Server 60 (192.168.1.60): Wazuh Manager + Monitoring Hub
  - Server 61 (192.168.1.61): Production E-commerce (CRITICAL)
  - Server 62 (192.168.1.62): Web Hosting

  Documentation:
  - SERVERS.md: /home/user/meta-env/SERVERS.md
  - Wazuh Docs: https://documentation.wazuh.com/current/
  - Prometheus Exporter: https://github.com/pyToshka/wazuh-prometheus-exporter
-->

<ossec_config>
  <!-- Global Configuration -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>localhost</smtp_server>
    <email_from>wazuh@192.168.1.60</email_from>
    <email_to>admin@okamih.local</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <white_list>127.0.0.1</white_list>
    <white_list>^localhost.localdomain$</white_list>
    <white_list>192.168.1.60</white_list>
    <white_list>192.168.1.61</white_list>
    <white_list>192.168.1.62</white_list>
    <white_list>10.8.0.0/24</white_list>
  </global>

  <!-- Alert Configuration -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- Remote Syslog Configuration -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- ==========================================
       Server 60 - Monitoring Hub Configuration
       ========================================== -->

  <!-- System Logs - Server 60 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
    <labels>
      <server>server-60</server>
      <hostname>backup</hostname>
      <role>monitoring</role>
    </labels>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
    <labels>
      <server>server-60</server>
      <hostname>backup</hostname>
      <role>monitoring</role>
    </labels>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
    <labels>
      <server>server-60</server>
      <hostname>backup</hostname>
      <role>monitoring</role>
    </labels>
  </localfile>

  <!-- Nginx Logs - Server 60 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/access.log</location>
    <labels>
      <server>server-60</server>
      <hostname>backup</hostname>
      <service>nginx</service>
      <role>monitoring</role>
    </labels>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/error.log</location>
    <labels>
      <server>server-60</server>
      <hostname>backup</hostname>
      <service>nginx</service>
      <role>monitoring</role>
    </labels>
  </localfile>

  <!-- PostgreSQL Logs - Server 60 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/postgresql/postgresql-15-main.log</location>
    <labels>
      <server>server-60</server>
      <hostname>backup</hostname>
      <service>postgresql</service>
      <database>postgresql</database>
      <role>monitoring</role>
    </labels>
  </localfile>

  <!-- OpenVPN Logs - Server 60 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/openvpn.log</location>
    <labels>
      <server>server-60</server>
      <hostname>backup</hostname>
      <service>openvpn</service>
      <vpn>10.8.0.0/24</vpn>
      <role>monitoring</role>
    </labels>
  </localfile>

  <!-- Grafana Logs - Server 60 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/grafana/grafana.log</location>
    <labels>
      <server>server-60</server>
      <hostname>backup</hostname>
      <service>grafana</service>
      <role>monitoring</role>
    </labels>
  </localfile>

  <!-- ==========================================
       Server 61 - Production E-commerce (CRITICAL)
       ========================================== -->

  <!-- System Logs - Server 61 (via remote agent) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/remote/server-61/auth.log</location>
    <labels>
      <server>server-61</server>
      <hostname>okamih</hostname>
      <role>ecommerce</role>
      <environment>production</environment>
      <criticality>high</criticality>
    </labels>
  </localfile>

  <!-- Apache Logs - Server 61 -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/ossec/logs/remote/server-61/apache2/access.log</location>
    <labels>
      <server>server-61</server>
      <hostname>okamih</hostname>
      <service>apache</service>
      <role>ecommerce</role>
      <environment>production</environment>
    </labels>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/ossec/logs/remote/server-61/apache2/error.log</location>
    <labels>
      <server>server-61</server>
      <hostname>okamih</hostname>
      <service>apache</service>
      <role>ecommerce</role>
      <environment>production</environment>
    </labels>
  </localfile>

  <!-- PrestaShop Logs - Server 61 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/remote/server-61/prestashop/*.log</location>
    <labels>
      <server>server-61</server>
      <hostname>okamih</hostname>
      <service>prestashop</service>
      <application>okamih-cz</application>
      <role>ecommerce</role>
      <environment>production</environment>
      <criticality>critical</criticality>
    </labels>
  </localfile>

  <!-- MariaDB Logs - Server 61 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/remote/server-61/mysql/error.log</location>
    <labels>
      <server>server-61</server>
      <hostname>okamih</hostname>
      <service>mariadb</service>
      <database>mariadb</database>
      <role>ecommerce</role>
      <environment>production</environment>
      <criticality>critical</criticality>
    </labels>
  </localfile>

  <!-- PHP-FPM Logs - Server 61 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/remote/server-61/php8.4-fpm.log</location>
    <labels>
      <server>server-61</server>
      <hostname>okamih</hostname>
      <service>php-fpm</service>
      <role>ecommerce</role>
      <environment>production</environment>
    </labels>
  </localfile>

  <!-- ==========================================
       Server 62 - Web Hosting
       ========================================== -->

  <!-- System Logs - Server 62 (via remote agent) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/remote/server-62/auth.log</location>
    <labels>
      <server>server-62</server>
      <hostname>cpall</hostname>
      <role>webhosting</role>
      <environment>production</environment>
    </labels>
  </localfile>

  <!-- Nginx Logs - Server 62 -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/remote/server-62/nginx/access.log</location>
    <labels>
      <server>server-62</server>
      <hostname>cpall</hostname>
      <service>nginx</service>
      <role>webhosting</role>
      <environment>production</environment>
    </labels>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/remote/server-62/nginx/error.log</location>
    <labels>
      <server>server-62</server>
      <hostname>cpall</hostname>
      <service>nginx</service>
      <role>webhosting</role>
      <environment>production</environment>
    </labels>
  </localfile>

  <!-- ==========================================
       File Integrity Monitoring (FIM)
       ========================================== -->

  <!-- Server 60 - Critical System Files -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency> <!-- 12 hours -->
    <scan_on_start>yes</scan_on_start>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!-- System configuration -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/usr/bin,/usr/sbin</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/bin,/sbin</directories>

    <!-- Nginx configuration and web roots -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/nginx</directories>
    <directories check_all="yes" realtime="no" report_changes="no">/var/www</directories>

    <!-- PostgreSQL -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/postgresql</directories>

    <!-- OpenVPN -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/openvpn</directories>

    <!-- Grafana & Prometheus -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/grafana</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/prometheus</directories>

    <!-- SSH -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/root/.ssh</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/home/*/.ssh</directories>
  </syscheck>

  <!-- Server 61 - E-commerce Critical Files (via agent) -->
  <!-- Configure on agent: /var/ossec/etc/ossec.conf -->
  <!-- Monitor: /var/www/okamih.cz/www, /etc/apache2, /etc/php, /etc/mysql -->

  <!-- Server 62 - Web Hosting Files (via agent) -->
  <!-- Configure on agent: /var/ossec/etc/ossec.conf -->
  <!-- Monitor: /var/www, /etc/nginx -->

  <!-- ==========================================
       Rootkit Detection
       ========================================== -->

  <rootcheck>
    <disabled>no</disabled>
    <check_unixaudit>yes</check_unixaudit>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency> <!-- 12 hours -->
    <rootkit_files>/var/ossec/etc/shared/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>/var/ossec/etc/shared/rootkit_trojans.txt</rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <!-- ==========================================
       Vulnerability Detection
       ========================================== -->

  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <min_full_scan_interval>6h</min_full_scan_interval>
    <run_on_start>yes</run_on_start>

    <!-- Debian vulnerability databases -->
    <provider name="debian">
      <enabled>yes</enabled>
      <os>bookworm</os>
      <os>trixie</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- National Vulnerability Database -->
    <provider name="nvd">
      <enabled>yes</enabled>
      <update_from_year>2020</update_from_year>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <!-- ==========================================
       Active Response (Security Actions)
       ========================================== -->

  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>route-null</name>
    <executable>route-null</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!-- Active Response: SSH Brute Force -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5710,5712</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- Active Response: Authentication Failed -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <level>10</level>
    <timeout>600</timeout>
  </active-response>

  <!-- ==========================================
       Rule Configuration
       ========================================== -->

  <rules>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
  </rules>

  <!-- ==========================================
       Authentication and Authorization
       ========================================== -->

  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>yes</use_source_ip>
    <force_insert>yes</force_insert>
    <force_time>0</force_time>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <limit_maxagents>yes</limit_maxagents>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <ssl_agent_ca>/var/ossec/etc/sslmanager.cert</ssl_agent_ca>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

  <!-- ==========================================
       Cluster Configuration (Optional - Multi-Site)
       ========================================== -->

  <!-- Enable if running Wazuh in cluster mode -->
  <!--
  <cluster>
    <name>wazuh-meta-env</name>
    <node_name>wazuh-master</node_name>
    <node_type>master</node_type>
    <key>c98b62a9b6169ac5f67dae55ae4a9088</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>192.168.1.60</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>no</disabled>
  </cluster>
  -->

  <!-- ==========================================
       Integration with External Tools
       ========================================== -->

  <!-- Prometheus Exporter Integration -->
  <!-- Install: https://github.com/pyToshka/wazuh-prometheus-exporter -->
  <!-- Configure exporter to expose metrics on port 9999 -->
  <!-- Prometheus will scrape from 192.168.1.60:9999 -->

  <!-- Grafana Integration -->
  <!-- Import dashboards:
       - Dashboard ID: 22448 (Wazuh Summary)
       - Dashboard ID: 21565 (SIEM XDR Wazuh)
  -->

  <!-- ==========================================
       Log Output Configuration
       ========================================== -->

  <logging>
    <log_format>plain</log_format>
  </logging>

</ossec_config>

<!--
  DEPLOYMENT INSTRUCTIONS:

  1. Install Wazuh Manager on Server 60 (192.168.1.60)
     - apt-get install wazuh-manager
     - Copy this file to /var/ossec/etc/ossec.conf
     - systemctl restart wazuh-manager

  2. Install Wazuh Agents on Server 61 and Server 62
     Server 61 (okamih - PRODUCTION E-COMMERCE):
     - apt-get install wazuh-agent
     - Configure manager IP: 192.168.1.60
     - Register agent: /var/ossec/bin/agent-auth -m 192.168.1.60
     - systemctl restart wazuh-agent

     Server 62 (cpall - WEB HOSTING):
     - apt-get install wazuh-agent
     - Configure manager IP: 192.168.1.60
     - Register agent: /var/ossec/bin/agent-auth -m 192.168.1.60
     - systemctl restart wazuh-agent

  3. Install Wazuh Prometheus Exporter on Server 60
     - GitHub: https://github.com/pyToshka/wazuh-prometheus-exporter
     - Configure to expose metrics on port 9999
     - Add to Prometheus scrape config (already configured)

  4. Configure Grafana Dashboards
     - Import Dashboard ID: 22448 (Wazuh Summary)
     - Import Dashboard ID: 21565 (SIEM XDR Wazuh)
     - Configure Prometheus as data source

  5. Configure UFW Firewall
     Server 60 (Manager):
     - sudo ufw allow from 192.168.1.0/24 to any port 1514 proto tcp
     - sudo ufw allow from 192.168.1.0/24 to any port 1515 proto tcp
     - sudo ufw allow from 192.168.1.0/24 to any port 9999 proto tcp

     Server 61 & 62 (Agents):
     - sudo ufw allow out to 192.168.1.60 port 1514 proto tcp
     - sudo ufw allow out to 192.168.1.60 port 1515 proto tcp

  6. Verify Installation
     - Server 60: /var/ossec/bin/wazuh-control status
     - Server 61/62: /var/ossec/bin/agent-control -l
     - Check logs: tail -f /var/ossec/logs/ossec.log
     - Check alerts: tail -f /var/ossec/logs/alerts/alerts.log

  SECURITY NOTES:

  - All Wazuh ports (1514, 1515, 9999) are LOCAL/VPN access ONLY
  - UFW blocks external access to these ports
  - Agents communicate with manager via secure TCP (1514)
  - Agent authentication via SSL certificates (1515)
  - Prometheus exporter is VPN/local only (9999)
  - Critical monitoring for Server 61 (production e-commerce)
  - File integrity monitoring on all web roots and configs
  - Active response enabled for SSH brute force and auth failures

  MULTI-PROJECT CONSIDERATIONS:

  - Use labels to organize alerts by server, role, and project
  - Configure agent groups for different server types
  - Use Filebeat pipelines to route logs by project
  - Implement custom rules for PrestaShop and AI projects
  - Set up email notifications for critical alerts
  - Configure log rotation to manage disk space

  REFERENCES:

  - Wazuh Documentation: https://documentation.wazuh.com/current/
  - Wazuh Multi-Site: https://wazuh.com/blog/wazuh-multi-site-implementation/
  - Prometheus Exporter: https://github.com/pyToshka/wazuh-prometheus-exporter
  - SERVERS.md: /home/user/meta-env/SERVERS.md
  - Prometheus Config: /home/user/meta-env/monitoring/prometheus/prometheus.yml
  - Grafana Config: /home/user/meta-env/monitoring/grafana/grafana.ini
-->
